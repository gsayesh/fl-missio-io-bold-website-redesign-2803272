<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Missio — bold website redesign · hero</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html{zoom:1.5}
  html,body{width:1600px;height:1200px;overflow:hidden}
  body{background:#EDE6DA;position:relative;font-family:Inter,system-ui,sans-serif}
  /* soft studio light on warm paper */
  body::before{content:"";position:absolute;inset:0;background:
    radial-gradient(1100px 700px at 50% 38%, #F7F3EC 0%, rgba(247,243,236,0) 70%),
    radial-gradient(1400px 500px at 50% 112%, rgba(6,42,51,.10), rgba(6,42,51,0) 70%)}
  .floor{position:absolute;left:170px;right:170px;top:1040px;height:70px;border-radius:50%;
    background:radial-gradient(closest-side, rgba(6,42,51,.32), rgba(6,42,51,0));filter:blur(14px)}
  .browser{position:absolute;left:108px;top:128px;width:1384px;border-radius:20px;overflow:hidden;background:#062A33;
    box-shadow:0 0 0 1px rgba(6,42,51,.18), 0 2px 4px rgba(6,42,51,.08), 0 30px 60px -20px rgba(6,42,51,.35), 0 70px 120px -40px rgba(6,42,51,.45)}
  .bar{height:46px;background:#F8F6F1;display:flex;align-items:center;padding:0 20px;gap:18px;border-bottom:1px solid #E3DDD2}
  .dots{display:flex;gap:8px}
  .dots i{width:12px;height:12px;border-radius:50%;background:#DCD5C9}
  .url{margin:0 auto;transform:translateX(-30px);width:420px;height:30px;border-radius:9px;background:#EDE8DF;display:flex;align-items:center;justify-content:center;gap:8px;font:500 14px/1 Inter,system-ui,sans-serif;color:#41545B;letter-spacing:.01em}
  .url svg{width:12px;height:12px}
  .screen{width:1384px;height:865px;overflow:hidden;position:relative}
  .screen iframe{width:1440px;height:900px;border:0;transform:scale(.96111);transform-origin:0 0;display:block}
</style>
</head>
<body>
  <div class="floor"></div>
  <div class="browser">
    <div class="bar">
      <span class="dots"><i></i><i></i><i></i></span>
      <span class="url"><svg viewBox="0 0 12 12"><path d="M3.5 5.5V4a2.5 2.5 0 015 0v1.5M2.5 5.5h7v5h-7z" fill="none" stroke="#41545B" stroke-width="1.3"/></svg>missio.io</span>
    </div>
    <div class="screen"><img src="../assets/board/home-hero.png" alt="Missio homepage hero" style="width:1384px;height:865px;display:block"></div>
  </div>
</body>
</html>
